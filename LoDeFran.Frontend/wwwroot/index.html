<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoDeFran.Frontend</title>
    <base href="/" />

    <!-- Estilos principales -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="LoDeFran.Frontend.styles.css" rel="stylesheet" />

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <!-- ✅ DataTables CSS + Botones -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <!-- ✅ Blazor WebAssembly -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- ✅ jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- ✅ DataTables JS + Botones -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>

    <!-- ✅ Bootstrap JS (modals, dropdowns, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ✅ JS personalizados -->
    <script src="js/LoDeFran.Frontend.styles.js"></script>

    <!-- ✅ Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <link href="_content/Syncfusion.Blazor/styles/bootstrap5.css" rel="stylesheet" />
    <script src="_content/Syncfusion.Blazor/scripts/sf-blazor.min.js"></script>

    <!-- ✅ Funciones globales JS -->
    <script>

        window.mostrarModal = (selector) => {
            var myModal = new bootstrap.Modal(document.querySelector(selector));
            myModal.show();
        };

        window.cerrarModal = (selector) => {
            var modalElement = document.querySelector(selector);
            var modalInstance = bootstrap.Modal.getInstance(modalElement);
            if (modalInstance) {
                modalInstance.hide();
            }
        };

        window.initDataTableConBotones = (idTabla) => {
            const table = $('#' + idTabla).DataTable({
                destroy: true,
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'excelHtml5',
                        text: 'Exportar a Excel',
                        className: 'btn btn-success'
                    },
                    {
                        extend: 'pdfHtml5',
                        text: 'Exportar a PDF',
                        className: 'btn btn-danger'
                    }
                ],
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
                }
            });
        };
        window.expandSelect = function (id) {
            const select = document.getElementById(id);
            if (select) {
                select.focus();
                select.size = select.options.length > 5 ? 5 : select.options.length; // mostrar hasta 5
            }
        };

        window.resetSelectSize = function (id) {
            const select = document.getElementById(id);
            if (select) {
                select.size = 1;
            }
        };
        window.initializeDataTable = (idTabla) => {
            setTimeout(() => {
                const selector = $('#' + idTabla);

                // Verifica si ya está inicializada
                if ($.fn.DataTable.isDataTable(selector)) {
                    selector.DataTable().clear().destroy(); // ⚠️ Destruye tabla existente
                }

                // Inicializa nuevamente
                selector.DataTable({
                    dom: 'Bfrtip',
                    buttons: [
                        {
                            extend: 'excelHtml5',
                            text: 'Exportar a Excel',
                            className: 'btn btn-success'
                        },
                        {
                            extend: 'pdfHtml5',
                            text: 'Exportar a PDF',
                            className: 'btn btn-danger'
                        }
                    ],
                    language: {
                        url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
                    }
                });
            }, 500); // pequeño delay para que el DOM esté actualizado
        };

        window.registrarInstanciaBlazor = (dotNetHelper) => {
            window.dotNetBlazorHelper = dotNetHelper;
        };

        window.inicializarSelectCalle = () => {
            const calleInput = document.getElementById("selectCalle");
            if (!calleInput) return;

            if (calleInput.tomselect) {
                calleInput.tomselect.destroy();
            }

            new TomSelect("#selectCalle", {
                valueField: "descripcion",
                labelField: "descripcion",
                searchField: "descripcion",
                placeholder: "Buscar calle...",
                preload: false,
                load: function (query, callback) {
                    if (query.length < 3) return callback();

                    const url = `http://localhost:82/api/calles/autocomplete?texto=${encodeURIComponent(query)}`;
                    fetch(url)
                        .then(response => response.json())
                        .then(data => callback(data))
                        .catch(error => {
                            console.error("Error al buscar calles:", error);
                            callback();
                        });
                },
                onChange: function (nombreCalle) {
                    if (window.dotNetBlazorHelper) {
                        window.dotNetBlazorHelper.invokeMethodAsync("SetCalleDesdeJS", nombreCalle)
                            .then(() => console.log("Calle enviada a Blazor:", nombreCalle))
                            .catch(err => console.error("Error enviando calle a Blazor:", err));
                    }
                }
            });
        };


        window.destroyDataTable = (idTabla) => {
            const selector = $('#' + idTabla);
            if ($.fn.DataTable.isDataTable(selector)) {
                selector.DataTable().clear().destroy();
                console.log("DataTable destruido:", idTabla);
            }
        };


        window.initializeDataTableCuandoTengaFilas = (idTabla) => {
            const tabla = document.getElementById(idTabla);
            if (!tabla) return;

            const tbody = tabla.querySelector('tbody');
            if (!tbody) return;

            // Si ya tiene filas, inicializar de una
            if (tbody.rows.length > 0) {
                console.log("Inicializando DataTable directamente, filas:", tbody.rows.length);
                window.initializeDataTable(idTabla);
                return;
            }

            // Observar el tbody para detectar cuando se agreguen filas
            const observer = new MutationObserver((mutationsList, observerInstance) => {
                const filas = tbody.querySelectorAll('tr');
                if (filas.length > 0) {
                    console.log("🚀 Detectadas filas nuevas en el DOM:", filas.length);
                    console.log("📋 Contenido de la tabla:", tbody.innerHTML);

                    observerInstance.disconnect(); // Deja de observar
                    window.initializeDataTable(idTabla);
                }
            });

            observer.observe(tbody, {
                childList: true,
                subtree: false
            });

            console.log("Observando tbody hasta que se carguen filas...");


        };

    </script>
</body>

</html>
